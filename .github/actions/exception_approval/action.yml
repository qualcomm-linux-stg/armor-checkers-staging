name: "ARMOR Exception Approval"
description: "Approve a breaking change exception for ARMOR checks"

inputs:
  commenter:
    description: 'GitHub login of the user who commented'
    required: true
  pr-number:
    description: 'PR number to add label to'
    required: true
  repository:
    description: 'owner/repo of the calling repository'
    required: true
  approver-team:
    description: 'GitHub team slug to check membership against (e.g. audio-api-owners)'
    required: false
    default: ''
  token:
    description: 'Token with read:org scope for team membership check'
    required: false
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - name: Check approver permission
      id: permission-check
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        COMMENTER: ${{ inputs.commenter }}
        REPOSITORY: ${{ inputs.repository }}
        PR_NUMBER: ${{ inputs.pr-number }}
        APPROVER_TEAM: ${{ inputs.approver-team }}
      run: |
        set -euo pipefail
        echo "[DEBUG] Checking if $COMMENTER is authorized for repo: $REPOSITORY"

        if [[ -n "$APPROVER_TEAM" ]]; then
          ORG=$(echo "$REPOSITORY" | cut -d'/' -f1)
          echo "[DEBUG] Checking team membership: ${ORG}/${APPROVER_TEAM}"
          STATE=$(gh api orgs/${ORG}/teams/${APPROVER_TEAM}/memberships/${COMMENTER} \
            --jq '.state' 2>/dev/null || echo "")
          echo "[DEBUG] Team membership state: '${STATE}'"

          if [[ "$STATE" == "active" ]]; then
            echo "[DEBUG] ${COMMENTER} is an active member of ${APPROVER_TEAM}"
            echo "approved=true" >> "$GITHUB_OUTPUT"
            echo "team-missing=false" >> "$GITHUB_OUTPUT"
          else
            STATUS=$(gh api orgs/${ORG}/teams/${APPROVER_TEAM} --jq '.id' 2>/dev/null || echo "")
            if [[ -z "$STATUS" ]]; then
              echo "[DEBUG] Team ${APPROVER_TEAM} not found in org ${ORG}"
              echo "approved=false" >> "$GITHUB_OUTPUT"
              echo "team-missing=true" >> "$GITHUB_OUTPUT"
              gh api repos/${REPOSITORY}/issues/${PR_NUMBER}/comments \
                --method POST \
                --field body=":information_source: Team \`${APPROVER_TEAM}\` not found in org \`${ORG}\`. Create the team and add approvers to enable exception approval." 2>/dev/null || true
            else
              echo "[DEBUG] ${COMMENTER} is not a member of ${APPROVER_TEAM}"
              echo "approved=false" >> "$GITHUB_OUTPUT"
              echo "team-missing=false" >> "$GITHUB_OUTPUT"
            fi
          fi
        else

          echo "[DEBUG] No approver-team provided — skipping exception check"
          echo "approved=false" >> "$GITHUB_OUTPUT"
          echo "team-missing=true" >> "$GITHUB_OUTPUT"
          gh api repos/${REPOSITORY}/issues/${PR_NUMBER}/comments \
            --method POST \
            --field body=":information_source: No \`approver-team\` configured. Pass the team slug as input to enable exception approval." 2>/dev/null || true
        fi

    - name: Add label and re-run failed checks
      if: steps.permission-check.outputs.approved == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        COMMENTER: ${{ inputs.commenter }}
        REPOSITORY: ${{ inputs.repository }}
      run: |
        set -euo pipefail
        echo "[DEBUG] Starting exception approval"
        echo "[DEBUG] Commenter : $COMMENTER"
        echo "[DEBUG] Repository: $REPOSITORY"
        echo "[DEBUG] PR Number : $PR_NUMBER"

        gh api repos/${REPOSITORY}/issues/${PR_NUMBER}/labels \
          --method POST \
          --field labels[]='armor-exception-approved'
        echo "[DEBUG] Label 'armor-exception-approved' added"

        HEAD_SHA=$(gh api repos/${REPOSITORY}/pulls/${PR_NUMBER} --jq '.head.sha')
        BRANCH=$(gh api repos/${REPOSITORY}/pulls/${PR_NUMBER} --jq '.head.ref')
        echo "[DEBUG] PR head SHA: ${HEAD_SHA}"
        echo "[DEBUG] PR branch  : ${BRANCH}"

        echo "[DEBUG] Recent runs on branch ${BRANCH}:"
        gh run list --repo ${REPOSITORY} --branch ${BRANCH} --limit 10 \
          --json databaseId,headSha,conclusion,displayTitle,status \
          --jq '.[] | "[DEBUG] id=\(.databaseId) sha=\(.headSha) conclusion=\(.conclusion) status=\(.status) title=\(.displayTitle)"'

        RUN_IDS=$(gh api "repos/${REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&event=pull_request&status=failure" \
          --jq '[.workflow_runs | group_by(.workflow_id)[] | sort_by(.updated_at) | reverse | .[0].id] | .[]')

        echo "[DEBUG] Latest failed run IDs (one per workflow): '${RUN_IDS}'"

        if [[ -z "$RUN_IDS" ]]; then
          echo "[DEBUG] No failed runs found for SHA ${HEAD_SHA}"
          gh api repos/${REPOSITORY}/issues/${PR_NUMBER}/comments \
            --method POST \
            --field body=":warning: Exception label added by @${COMMENTER} but no failed workflow runs found to re-run. Please re-run manually."
          exit 1
        fi

        for RUN_ID in $RUN_IDS; do
          echo "[DEBUG] Re-running failed jobs in run ${RUN_ID}"
          gh run rerun ${RUN_ID} --failed --repo ${REPOSITORY}
        done
        echo "[DEBUG] All failed runs re-triggered successfully"

    - name: Reject if not authorized
      if: steps.permission-check.outputs.approved != 'true' && steps.permission-check.outputs.team-missing != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        COMMENTER: ${{ inputs.commenter }}
        REPOSITORY: ${{ inputs.repository }}
        APPROVER_TEAM: ${{ inputs.approver-team }}
      run: |
        gh api repos/${REPOSITORY}/issues/${PR_NUMBER}/comments \
          --method POST \
          --field body=":no_entry: @${COMMENTER} is not authorized to approve breaking changes. You must be a member of the \`${APPROVER_TEAM}\` team."
