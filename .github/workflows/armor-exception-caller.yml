name: ARMOR Exception Approval

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  actions: write
  contents: read

jobs:
  load-approvers:
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, 'approve-breaking-change')
    runs-on: ubuntu-latest
    outputs:
      approvers: ${{ steps.read.outputs.approvers }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/armor-approvers
          sparse-checkout-cone-mode: false

      - name: Read approvers file
        id: read
        run: |
          if [[ -f ".github/armor-approvers" ]]; then
            {
              echo "approvers<<EOF"
              cat .github/armor-approvers
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "approvers=" >> "$GITHUB_OUTPUT"
          fi

  approve-exception:
    needs: load-approvers
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, 'approve-breaking-change')
    uses: qualcomm-linux-stg/armor-checkers-staging/.github/workflows/armor-exception.yml@armor-exception
    with:
      commenter: ${{ github.event.comment.user.login }}
      pr-number: ${{ github.event.issue.number }}
      repository: ${{ github.repository }}
      approvers: ${{ needs.load-approvers.outputs.approvers }}
    permissions:
      issues: write
      pull-requests: write
      actions: write
