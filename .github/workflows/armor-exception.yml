name: ARMOR Exception Approval

on:
  workflow_call:
    inputs:
      commenter:
        required: true
        type: string
        description: 'GitHub login of the user who commented'
      pr-number:
        required: true
        type: number
        description: 'PR number to add label to'
      repository:
        required: true
        type: string
        description: 'owner/repo of the calling repository'

jobs:
  approve-exception:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      actions: write
    steps:
      - name: Check admin permission
        id: permission-check
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENTER: ${{ inputs.commenter }}
          REPOSITORY: ${{ inputs.repository }}
        run: |
          set -euo pipefail
          PERMISSION=$(gh api repos/${REPOSITORY}/collaborators/${COMMENTER}/permission \
            --jq '.permission' 2>/dev/null || echo "none")
          echo "permission=$PERMISSION" >> "$GITHUB_OUTPUT"
          echo "Commenter: $COMMENTER, Permission: $PERMISSION"

      - name: Add label and re-run failed checks
        if: steps.permission-check.outputs.permission == 'admin'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          COMMENTER: ${{ inputs.commenter }}
          REPOSITORY: ${{ inputs.repository }}
        run: |
          set -euo pipefail

          gh api repos/${REPOSITORY}/issues/${PR_NUMBER}/labels \
            --method POST \
            --field labels[]='armor-exception-approved'

          HEAD_SHA=$(gh api repos/${REPOSITORY}/pulls/${PR_NUMBER} --jq '.head.sha')
          echo "PR head SHA: ${HEAD_SHA}"

          RUN_ID=$(gh run list --repo ${REPOSITORY} \
            --json databaseId,headSha,conclusion \
            --jq ".[] | select(.headSha == \"${HEAD_SHA}\" and .conclusion == \"failure\") | .databaseId" \
            | head -1)

          echo "Failed run ID: ${RUN_ID}"

          if [[ -z "$RUN_ID" ]]; then
            echo "No failed run found for SHA ${HEAD_SHA}. Listing recent runs for debug:"
            gh run list --repo ${REPOSITORY} --limit 5 --json databaseId,headSha,conclusion,displayTitle
            gh api repos/${REPOSITORY}/issues/${PR_NUMBER}/comments \
              --method POST \
              --field body=":warning: Exception label added by @${COMMENTER} but no failed workflow run found to re-run. Please re-run manually."
            exit 1
          fi

          gh run rerun ${RUN_ID} --failed --repo ${REPOSITORY}

      - name: Reject if not authorized
        if: steps.permission-check.outputs.permission != 'admin'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          COMMENTER: ${{ inputs.commenter }}
          REPOSITORY: ${{ inputs.repository }}
        run: |
          gh api repos/${REPOSITORY}/issues/${PR_NUMBER}/comments \
            --method POST \
            --field body=":no_entry: @${COMMENTER} is not authorized to approve breaking changes. Admin access on this repository is required."
